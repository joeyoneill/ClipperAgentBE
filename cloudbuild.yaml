# ==============================================================================
# CLIP_AGENT_OS — Backend CI/CD Pipeline (capstone_be/cloudbuild.yaml)
# ==============================================================================
# Safe for public GitHub repositories: contains NO hardcoded project IDs,
# service account emails, bucket names, or Cloud Run URLs. All environment-specific
# values are injected via Cloud Build substitution variables ($_...).
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Python Linting & Static Code Quality (ruff)
  # ----------------------------------------------------------------------------
  - id: "lint"
    name: "ghcr.io/astral-sh/uv:python3.14-bookworm-slim"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -eu
        echo "==> [1/5] Running Ruff linter across backend source..."
        uvx ruff check --select E9,F63,F7,F82 .

  # ----------------------------------------------------------------------------
  # Step 2: Hermetic Unit, Integration & 4-Pillar AI Evaluation Suite (pytest)
  # Enforces >= 80% line coverage gate + deterministic RAG/Boundary/Guardrail evals
  # ----------------------------------------------------------------------------
  - id: "test-and-eval"
    name: "ghcr.io/astral-sh/uv:python3.14-bookworm-slim"
    entrypoint: "sh"
    env:
      - "GCP_PROJECT_ID=$PROJECT_ID"
      - "GCP_REGION=$_REGION"
      - "FIRESTORE_DB_NAME=$_FIRESTORE_DB_NAME"
      - "LFVIDEO_COLLECTION_NAME=lfvideos"
      - "LFVIDEO_SEGMENT_COLLECTION_NAME=lf_video_segments"
      - "CHAT_SESSION_COLLECTION_NAME=chat_sessions"
      - "SFVIDEO_COLLECTION_NAME=sfvideos"
      - "ALLOWLIST_COLLECTION_NAME=app_config"
      - "ALLOWLIST_DOC_ID=allowlist"
      - "GCS_ROOT_BUCKET_NAME=$_GCS_BUCKET_NAME"
      - "VIDEO_PROCESSOR_JOB_NAME=$_VIDEO_PROCESSOR_JOB_NAME"
      - "EMBEDDING_MODEL_NAME=$_EMBEDDING_MODEL_NAME"
      - "ORCHESTRATOR_MODEL_NAME=$_ORCHESTRATOR_MODEL_NAME"
      - "CLIPPER_SUBAGENT_MODEL_NAME=$_CLIPPER_SUBAGENT_MODEL_NAME"
      - "MODEL_ARMOR_TEMPLATE_NAME=projects/$PROJECT_ID/locations/$_REGION/templates/$_MODEL_ARMOR_TEMPLATE_ID"
      - "SIGNING_SERVICE_ACCOUNT_EMAIL=$_SERVICE_ACCOUNT_EMAIL"
      - "FRONTEND_URL=http://localhost:5173,http://localhost:8080,$_FRONTEND_URL"
      - "ENABLE_CLOUD_TRACE=false"
    args:
      - "-c"
      - |
        set -eu
        echo "==> [2/5] Installing dev dependencies and executing pytest + AI evaluations..."
        rm -f uv.lock
        uv sync --dev
        uv run pytest -v --cov
    waitFor:
      - "lint"

  # ----------------------------------------------------------------------------
  # Step 3: Build Versioned Docker Image (:$BUILD_ID and :latest)
  # ----------------------------------------------------------------------------
  - id: "docker-build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${BUILD_ID}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest"
      - "."
    waitFor:
      - "test-and-eval"

  # ----------------------------------------------------------------------------
  # Step 4: Push Images to Artifact Registry (Triggers Container Scanning API)
  # ----------------------------------------------------------------------------
  - id: "docker-push"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}"
    waitFor:
      - "docker-build"

  # ----------------------------------------------------------------------------
  # Step 5: Deploy to Cloud Run (VPC-Internal) with Health Verification & Rollback
  # ----------------------------------------------------------------------------
  - id: "deploy-and-verify"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${BUILD_ID}"

        echo "==> [5/5] Capturing active serving revision for rollback protection..."
        PREV_REV="$$(gcloud run services describe "${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format="value(status.latestReadyRevisionName)" 2>/dev/null || true)"
        echo "Previous Ready Revision: $${PREV_REV:-none}"

        rollback_on_failure() {
          echo "ERROR: Deployment or health check failed for ${_SERVICE_NAME}."
          if [[ -n "$${PREV_REV}" ]]; then
            echo "Rolling back 100% of traffic to previous healthy revision: $${PREV_REV}..."
            gcloud run services update-traffic "${_SERVICE_NAME}" \
              --region="${_REGION}" \
              --project="${PROJECT_ID}" \
              --to-revisions="$${PREV_REV}=100"
          fi
          exit 1
        }
        trap rollback_on_failure ERR

        echo "==> Deploying ${_SERVICE_NAME} revision (${BUILD_ID}) to Cloud Run..."
        gcloud run deploy "${_SERVICE_NAME}" \
          --image="$${IMAGE_URI}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --ingress=internal \
          --no-invoker-iam-check \
          --network="${_VPC_NETWORK}" \
          --subnet="${_VPC_SUBNET}" \
          --vpc-egress=private-ranges-only \
          --service-account="${_SERVICE_ACCOUNT_EMAIL}" \
          --cpu=2 \
          --memory=2Gi \
          --timeout=900 \
          --session-affinity \
          --set-secrets="GEMINI_API_KEY=${_GEMINI_SECRET_NAME}:latest" \
          --set-env-vars="^;^FRONTEND_URL=http://localhost:5173,http://localhost:8080,${_FRONTEND_URL};GCP_PROJECT_ID=${PROJECT_ID};GCP_REGION=${_REGION};FIRESTORE_DB_NAME=${_FIRESTORE_DB_NAME};LFVIDEO_COLLECTION_NAME=lfvideos;LFVIDEO_SEGMENT_COLLECTION_NAME=lf_video_segments;CHAT_SESSION_COLLECTION_NAME=chat_sessions;SFVIDEO_COLLECTION_NAME=sfvideos;ALLOWLIST_COLLECTION_NAME=app_config;ALLOWLIST_DOC_ID=allowlist;GCS_ROOT_BUCKET_NAME=${_GCS_BUCKET_NAME};VIDEO_PROCESSOR_JOB_NAME=${_VIDEO_PROCESSOR_JOB_NAME};EMBEDDING_MODEL_NAME=${_EMBEDDING_MODEL_NAME};ORCHESTRATOR_MODEL_NAME=${_ORCHESTRATOR_MODEL_NAME};CLIPPER_SUBAGENT_MODEL_NAME=${_CLIPPER_SUBAGENT_MODEL_NAME};SIGNING_SERVICE_ACCOUNT_EMAIL=${_SERVICE_ACCOUNT_EMAIL};MODEL_ARMOR_TEMPLATE_NAME=projects/${PROJECT_ID}/locations/${_REGION}/templates/${_MODEL_ARMOR_TEMPLATE_ID}"

        NEW_REV="$$(gcloud run services describe "${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format="value(status.latestReadyRevisionName)")"
        READY_STATUS="$$(gcloud run revisions describe "$${NEW_REV}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format="value(status.conditions[?(@.type=='Ready')].status)")"

        if [[ "$${READY_STATUS}" == "False" ]]; then
          rollback_on_failure
        fi
        echo "==> Successfully deployed and verified Ready revision: $${NEW_REV}"
    waitFor:
      - "docker-push"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${BUILD_ID}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest"

substitutions:
  _REGION: "us-central1"
  _AR_REPO: "your-artifact-repo"
  _SERVICE_NAME: "your-backend-service"
  _VPC_NETWORK: "your-vpc-network"
  _VPC_SUBNET: "your-vpc-subnet"
  _SERVICE_ACCOUNT_EMAIL: "your-backend-sa@your-project-id.iam.gserviceaccount.com"
  _FRONTEND_URL: "https://your-frontend-service.a.run.app"
  _FIRESTORE_DB_NAME: "your-firestore-db"
  _GCS_BUCKET_NAME: "your-gcs-bucket"
  _VIDEO_PROCESSOR_JOB_NAME: "your-video-processor-job"
  _MODEL_ARMOR_TEMPLATE_ID: "your-model-armor-template"
  _EMBEDDING_MODEL_NAME: "gemini-embedding-2"
  _ORCHESTRATOR_MODEL_NAME: "gemini-3.8-flash"
  _CLIPPER_SUBAGENT_MODEL_NAME: "gemini-3.8-flash"
  _GEMINI_SECRET_NAME: "GEMINI_API_KEY"

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
