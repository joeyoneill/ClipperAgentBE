[project]
name = "capstone-be"
version = "0.1.0"
description = "Google FDE capstone project: Clipper Agent Web application backend service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.9.2",
    "google-auth>=2.58.0",
    "google-cloud-firestore>=2.33.0",
    "google-cloud-modelarmor>=0.7.2",
    "google-cloud-run>=0.16.2",
    "google-cloud-secret-manager>=2.31.0",
    "google-cloud-storage>=3.15.1",
    "google-cloud-trace>=1.21.0",
    "imageio-ffmpeg>=0.6.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-resourcedetector-gcp>=1.14.0",
    "opentelemetry-sdk>=1.42.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
    "websockets>=15.0.1",
]

[project.scripts]
capstone-be = "capstone_be:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
pythonpath = ["."]

[tool.coverage.run]
source = ["models", "utils", "routes", "agent", "main"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]


